name: Review follow-ups

# 自動フォローアップ: 毎時、送信期限が来たレビュー依頼メールを送る。
# 必要な設定: リポジトリの Secrets に CRON_SECRET を追加し、
#             Cloudflare Pages の環境変数にも同じ CRON_SECRET を登録する。
on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger follow-up sending
        run: |
          curl -fsS -X POST "https://star-reviews.net/api/cron/followups" \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}"
