<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>パスワード再設定｜star-reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fffdf5;--panel:#fff;--ink:#1c1a12;--ink-soft:#413d30;--muted:#7c7563;
    --sun:#ffc62b;--sun-deep:#eaa400;--sun-soft:#ffe7a0;--line-strong:#e0d4b6;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    --disp:"Space Grotesk",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:18px;
    color:var(--ink);text-decoration:none;margin-bottom:18px}
  .brand .star{width:18px;height:18px;color:var(--sun-deep)}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line-strong);border-radius:20px;
    padding:28px 26px;box-shadow:0 10px 34px rgba(60,46,12,.1)}
  h1{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink-soft)}
  input{width:100%;border:1.5px solid var(--line-strong);border-radius:12px;padding:12px 14px;font:inherit;
    background:#fffef9;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px var(--sun-soft)}
  .btn{width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;
    padding:14px;cursor:pointer;font-family:var(--jp)}
  .btn:hover{background:#000}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{font-size:13.5px;margin:12px 0 0;border-radius:9px;padding:10px 12px;display:none}
  .msg.err{color:#b4341f;background:#fdecea}
  .msg.ok{color:#1c7d52;background:#e2f3e8}
  .foot{text-align:center;margin-top:16px;font-size:13px}
  .foot a{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-color:var(--sun-deep);text-underline-offset:3px}
</style>
</head>
<body>
  <div>
    <a class="brand" href="/">
      <svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.6l2.95 6.3 6.9.86-5.1 4.72 1.36 6.82L12 17.9l-6.06 3.4 1.35-6.82-5.1-4.72 6.9-.86z"/></svg>
      star·reviews
    </a>
    <div class="card">
      <h1>パスワードの再設定</h1>
      <p class="sub">新しいパスワード（8文字以上）を入力してください。</p>
      <form id="form">
        <label for="pw">新しいパスワード</label>
        <input type="password" id="pw" autocomplete="new-password" placeholder="••••••••" />
        <label for="pw2">確認のため再入力</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="••••••••" />
        <button class="btn" id="submit" type="submit">パスワードを変更する</button>
      </form>
      <p class="msg" id="msg"></p>
      <p class="foot"><a href="/#auth">ログイン画面へ戻る</a></p>
    </div>
  </div>
<script>
  const $=(id)=>document.getElementById(id);
  const token=new URLSearchParams(location.search).get("token")||"";
  function show(type,text){ const m=$("msg"); m.className="msg "+type; m.textContent=text; m.style.display="block"; }
  if(!token){ show("err","リンクが正しくありません。再設定メールのリンクから開いてください。"); $("submit").disabled=true; }
  $("form").addEventListener("submit", async (e)=>{
    e.preventDefault(); $("msg").style.display="none";
    const pw=$("pw").value, pw2=$("pw2").value;
    if(pw.length<8){ show("err","パスワードは8文字以上にしてください。"); return; }
    if(pw!==pw2){ show("err","確認用パスワードが一致しません。"); return; }
    const btn=$("submit"); btn.disabled=true; btn.textContent="変更中…";
    try{
      const r=await fetch("/api/auth/reset",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,password:pw})});
      const j=await r.json();
      if(!r.ok){ show("err", j.error||"エラーが発生しました"); btn.disabled=false; btn.textContent="パスワードを変更する"; return; }
      show("ok","パスワードを変更しました。ログイン画面からお進みください。");
      $("form").style.display="none";
      setTimeout(()=>{ location.href="/#auth"; }, 1800);
    }catch(err){ show("err","通信エラーが発生しました。"); btn.disabled=false; btn.textContent="パスワードを変更する"; }
  });
</script>
</body>
</html>
