<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>お客様の声をきかせてください</title>
<style>
  :root{
    --bg:#faf7f2; --ink:#272437; --muted:#726d80; --line:#ece2d4;
    --card:#fff; --accent:#e8604c; --accent-ink:#b8432f; --gold:#f3a712; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;padding:28px 18px 64px}
  .brand{font-size:13px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  h1{font-size:23px;line-height:1.4;margin:0 0 10px;font-weight:700}
  .intro{color:var(--muted);font-size:15px;margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 20px;margin-bottom:18px}
  .label{font-weight:700;font-size:15px;margin:0 0 10px}
  .stars{display:flex;gap:6px;font-size:38px;line-height:1}
  .stars span{cursor:pointer;color:#dcd3c6;transition:transform .08s}
  .stars span.on{color:var(--gold)}
  .stars span:active{transform:scale(.9)}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font:inherit;resize:vertical;min-height:96px;background:#fffdf9}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .levels{display:flex;flex-direction:column;gap:10px}
  .lv{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);
    border-radius:12px;padding:13px 14px;cursor:pointer;background:#fffdf9;transition:.12s}
  .lv:hover{border-color:#e4c9b7}
  .lv.sel{border-color:var(--accent);background:#fff6f3}
  .lv input{margin-top:4px;accent-color:var(--accent)}
  .lv .t{font-weight:700;font-size:15px}
  .lv .r{display:inline-block;margin-top:3px;font-size:13px;color:var(--accent-ink);
    background:#ffe9e2;border-radius:999px;padding:2px 10px;font-weight:700}
  .extra{display:none;margin-top:14px}
  .extra.show{display:block}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:#fffdf9}
  .consent{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
  .consent input{margin-top:4px;accent-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .btn{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-weight:700;font-size:17px;padding:15px;cursor:pointer;letter-spacing:.02em}
  .btn:disabled{opacity:.55;cursor:default}
  .err{color:#b8432f;font-size:14px;margin:10px 0 0;display:none}
  .photo-prev{max-width:120px;border-radius:10px;margin-top:8px;display:none}
  /* thanks */
  .thanks{text-align:center;padding:14px 4px}
  .thanks .big{font-size:22px;font-weight:700;margin:8px 0}
  .reward{background:#fff6f3;border:1.5px dashed var(--accent);border-radius:14px;
    padding:18px;margin:18px 0}
  .reward .rt{font-size:14px;color:var(--accent-ink);font-weight:700}
  .code{font-size:26px;font-weight:800;letter-spacing:.08em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
  .copy{border:1px solid var(--accent);background:#fff;color:var(--accent-ink);
    border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .foot{text-align:center;color:#a79f93;font-size:11.5px;margin-top:26px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap" id="root">
  <p class="brand" id="brand">お客様の声</p>
  <h1 id="title">読み込み中…</h1>
  <p class="intro" id="intro"></p>

  <form id="form" style="display:none">
    <div class="card">
      <p class="label">満足度を星で教えてください</p>
      <div class="stars" id="stars" role="radiogroup" aria-label="星評価">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>

    <div class="card">
      <p class="label">ひとことコメント</p>
      <textarea id="body" placeholder="どんなところが良かったですか？ 短くてOKです。"></textarea>
    </div>

    <div class="card">
      <p class="label">どこまで出すか選べます</p>
      <p class="hint" style="margin:-4px 0 12px">踏み込んで教えてくれた方には、お礼が手厚くなります。無理のない範囲でどうぞ。</p>
      <div class="levels" id="levels"></div>

      <div class="extra" id="extra">
        <div class="field">
          <label for="name">お名前・ニックネーム（イニシャルでもOK）</label>
          <input type="text" id="name" placeholder="例）S.K / さとう" />
        </div>
        <div class="field">
          <label for="photo">お写真（任意）</label>
          <input type="file" id="photo" accept="image/*" />
          <img class="photo-prev" id="photoPrev" alt="" />
        </div>
        <label class="consent">
          <input type="checkbox" id="consent" />
          <span>お名前・お写真をサイトに掲載することに同意します。</span>
        </label>
      </div>
    </div>

    <button class="btn" id="submit" type="submit">この内容で送る</button>
    <p class="err" id="err"></p>
  </form>

  <div id="done" style="display:none">
    <div class="card thanks">
      <div style="font-size:40px">🎉</div>
      <p class="big" id="thanksMsg">ありがとうございました！</p>
      <div class="reward" id="rewardBox" style="display:none">
        <p class="rt" id="rewardText"></p>
        <p class="code" id="rewardCode"></p>
        <button class="copy" id="copyBtn" type="button">コードをコピー</button>
        <p class="hint" style="margin-top:10px">次回ご利用時にこのコードをご提示ください。</p>
      </div>
    </div>
  </div>

  <p class="foot">POWERED BY STAR-REVIEWS</p>
</div>

<script>
const qs = new URLSearchParams(location.search);
const slug = qs.get("f");
const token = qs.get("t");
let rating = 0, level = 1, photoKey = null;

const $ = (id) => document.getElementById(id);

async function load(){
  if(!slug){ $("title").textContent = "リンクが正しくありません"; return; }
  const res = await fetch("/api/public/form/" + encodeURIComponent(slug));
  if(!res.ok){ $("title").textContent = "フォームが見つかりません"; return; }
  const f = await res.json();
  $("brand").textContent = f.business_name || "お客様の声";
  $("title").textContent = f.title;
  $("intro").textContent = f.intro || "";
  $("thanksMsg").textContent = f.thanks_message || "ありがとうございました！";
  renderLevels(f.levels);
  $("form").style.display = "block";
}

function renderLevels(levels){
  const box = $("levels");
  box.innerHTML = "";
  levels.forEach((lv, i) => {
    const el = document.createElement("label");
    el.className = "lv" + (i===0 ? " sel" : "");
    el.innerHTML =
      '<input type="radio" name="lv" value="'+lv.level+'"'+(i===0?" checked":"")+'>' +
      '<div><div class="t">'+lv.label+'</div>'+(lv.reward?'<span class="r">お礼：'+lv.reward+'</span>':'')+'</div>';
    el.querySelector("input").addEventListener("change", () => selectLevel(lv.level, el));
    box.appendChild(el);
  });
  level = levels[0]?.level || 1;
  toggleExtra();
}

function selectLevel(v, el){
  level = v;
  document.querySelectorAll(".lv").forEach(x => x.classList.remove("sel"));
  el.classList.add("sel");
  toggleExtra();
}
function toggleExtra(){ $("extra").classList.toggle("show", level >= 2); }

// stars
$("stars").querySelectorAll("span").forEach(s => {
  s.addEventListener("click", () => {
    rating = +s.dataset.v;
    $("stars").querySelectorAll("span").forEach(x => x.classList.toggle("on", +x.dataset.v <= rating));
  });
});

// photo preview
$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  if(file){ $("photoPrev").src = URL.createObjectURL(file); $("photoPrev").style.display="block"; }
});

function showErr(m){ const e=$("err"); e.textContent=m; e.style.display="block"; }

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").style.display="none";
  if(!rating){ showErr("星で評価を選んでください"); return; }
  if(!$("body").value.trim()){ showErr("ひとことコメントを入力してください"); return; }
  if(level >= 2 && !$("consent").checked){ showErr("掲載の同意にチェックしてください"); return; }

  const btn = $("submit"); btn.disabled = true; btn.textContent = "送信中…";
  try{
    // 写真アップロード（任意）
    const file = level >= 2 ? $("photo").files[0] : null;
    if(file){
      const up = await fetch("/api/public/upload", { method:"POST", headers:{ "content-type": file.type }, body: file });
      const uj = await up.json();
      if(up.ok) photoKey = uj.key;
    }
    const res = await fetch("/api/public/submit", {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({
        slug, level, rating,
        body: $("body").value.trim(),
        author_name: $("name").value.trim(),
        consent_display: level >= 2 ? $("consent").checked : true,
        photo_key: photoKey, token
      })
    });
    const j = await res.json();
    if(!res.ok){ showErr(j.error || "送信に失敗しました"); btn.disabled=false; btn.textContent="この内容で送る"; return; }
    done(j.reward);
  }catch(e){ showErr("通信エラーが発生しました"); btn.disabled=false; btn.textContent="この内容で送る"; }
});

function done(reward){
  $("form").style.display="none";
  $("done").style.display="block";
  if(reward){
    $("rewardBox").style.display="block";
    $("rewardText").textContent = "お礼：" + reward.text;
    $("rewardCode").textContent = reward.code;
    $("copyBtn").addEventListener("click", () => {
      navigator.clipboard?.writeText(reward.code);
      $("copyBtn").textContent = "コピーしました";
    });
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}

load();
</script>
</body>
</html>
