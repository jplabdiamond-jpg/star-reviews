<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>お客様の声をきかせてください</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fffdf5; --panel:#fff; --ink:#1c1a12; --ink-soft:#413d30; --muted:#7c7563;
    --sun:#ffc62b; --sun-deep:#eaa400; --sun-soft:#ffe7a0; --mark:#ffd84d;
    --line:#ece3cf; --line-strong:#e0d4b6; --radius:16px;
    --disp:"Space Grotesk",system-ui,sans-serif;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);
    line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px 70px}
  @media(max-width:640px){.wrap{padding:30px 15px 70px}}
  .topbar{display:flex;align-items:center;gap:7px;margin-bottom:22px}
  .topbar .star{width:16px;height:16px;color:var(--sun-deep)}
  .topbar .bz{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  h1{font-size:25px;line-height:1.38;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
  .intro{color:var(--ink-soft);font-size:15.5px;margin:0 0 26px}
  .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:22px 20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(60,46,12,.05)}
  .label{font-weight:800;font-size:15.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .label .dot{width:8px;height:8px;border-radius:2px;background:var(--sun);transform:rotate(-8deg)}
  .stars{display:flex;gap:8px;font-size:42px;line-height:1}
  .stars span{cursor:pointer;color:#e4dcc8;transition:transform .1s,color .1s}
  .stars span.on{color:var(--sun-deep)}
  .stars span:hover{transform:scale(1.08)}
  .stars span:active{transform:scale(.92)}
  textarea{width:100%;border:1.5px solid var(--line-strong);border-radius:12px;padding:13px 14px;
    font:inherit;resize:vertical;min-height:100px;background:#fffef9}
  textarea:focus,input:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px var(--sun-soft)}
  .levels{display:flex;flex-direction:column;gap:11px}
  .lv{display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line-strong);
    border-radius:13px;padding:14px 15px;cursor:pointer;background:#fffef9;transition:.14s}
  .lv:hover{border-color:var(--sun)}
  .lv.sel{border-color:var(--sun-deep);background:#fffaec}
  .lv input{margin-top:4px;accent-color:var(--sun-deep);width:17px;height:17px}
  .lv .t{font-weight:800;font-size:15px}
  .lv .r{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--ink);
    background:var(--sun);border-radius:999px;padding:2px 11px;font-weight:800}
  .extra{display:none;margin-top:16px}
  .extra.show{display:block}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  input[type=text]{width:100%;border:1.5px solid var(--line-strong);border-radius:12px;
    padding:12px 14px;font:inherit;background:#fffef9}
  input[type=file]{font:inherit;font-size:13px}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-soft)}
  .consent input{margin-top:4px;accent-color:var(--sun-deep);width:17px;height:17px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .btn{width:100%;border:0;border-radius:13px;background:var(--ink);color:#fff;
    font-weight:800;font-size:17px;padding:16px;cursor:pointer;transition:.15s;font-family:var(--jp)}
  .btn:hover{background:#000;transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .err{color:#b4341f;font-size:14px;margin:12px 0 0;display:none;background:#fdecea;border-radius:9px;padding:9px 12px}
  .photo-prev{max-width:120px;border-radius:10px;margin-top:10px;display:none;border:1px solid var(--line)}
  .video-prev{max-width:100%;border-radius:10px;margin-top:10px;display:none;background:#000}
  /* thanks */
  .thanks{text-align:center;padding:16px 4px}
  .thanks .mark-emoji{font-size:44px;line-height:1}
  .thanks .big{font-size:23px;font-weight:800;margin:10px 0}
  .reward{background:#fffaec;border:2px dashed var(--sun-deep);border-radius:16px;
    padding:20px;margin:20px 0;position:relative}
  .reward::before,.reward::after{content:"";position:absolute;top:50%;width:20px;height:20px;
    background:var(--paper);border-radius:50%;transform:translateY(-50%)}
  .reward::before{left:-11px}.reward::after{right:-11px}
  .reward .rt{font-size:14px;color:var(--ink);font-weight:800}
  .code{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:.08em;margin:10px 0 6px}
  .copy{border:2px solid var(--ink);background:#fff;color:var(--ink);
    border-radius:11px;padding:9px 18px;font-weight:800;cursor:pointer;font-size:14px;transition:.14s;font-family:var(--jp)}
  .copy:hover{background:var(--ink);color:#fff}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:28px;
    letter-spacing:.12em;font-family:var(--disp);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="topbar">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.95 6.3 6.9.86-5.1 4.72 1.36 6.82L12 17.9l-6.06 3.4 1.35-6.82-5.1-4.72 6.9-.86z"/></svg>
    <span class="bz" id="brand">お客様の声</span>
  </div>
  <h1 id="title">読み込み中…</h1>
  <p class="intro" id="intro"></p>

  <form id="form" style="display:none">
    <div class="card">
      <p class="label"><span class="dot"></span>満足度を星で教えてください</p>
      <div class="stars" id="stars" role="radiogroup" aria-label="星評価">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>

    <div class="card">
      <p class="label"><span class="dot"></span>ひとことコメント</p>
      <textarea id="body" placeholder="どんなところが良かったですか？ 短くてOKです。"></textarea>
    </div>

    <div class="card">
      <p class="label"><span class="dot"></span>どこまで出すか選べます</p>
      <p class="hint" style="margin:-6px 0 14px">踏み込んで教えてくれた方には、お礼が手厚くなります。無理のない範囲でどうぞ。</p>
      <div class="levels" id="levels"></div>

      <div class="extra" id="extra">
        <div class="field">
          <label for="name">お名前・ニックネーム（イニシャルでもOK）</label>
          <input type="text" id="name" placeholder="例）S.K / さとう" />
        </div>
        <div class="field">
          <label for="photo">お写真（任意）</label>
          <input type="file" id="photo" accept="image/*" />
          <img class="photo-prev" id="photoPrev" alt="" />
        </div>
        <div class="field" id="videoField" style="display:none">
          <label for="video">動画（60秒以内・60MBまで / MP4推奨）</label>
          <input type="file" id="video" accept="video/*" />
          <video class="video-prev" id="videoPrev" controls playsinline></video>
          <p class="hint" id="videoHint"></p>
        </div>
        <label class="consent">
          <input type="checkbox" id="consent" />
          <span>お名前・お写真・動画をサイトに掲載することに同意します。</span>
        </label>
      </div>
    </div>

    <button class="btn" id="submit" type="submit">この内容で送る</button>
    <p class="err" id="err"></p>
  </form>

  <div id="done" style="display:none">
    <div class="card thanks">
      <div class="mark-emoji">🎉</div>
      <p class="big" id="thanksMsg">ありがとうございました！</p>
      <div class="reward" id="rewardBox" style="display:none">
        <p class="rt" id="rewardText"></p>
        <p class="code" id="rewardCode"></p>
        <button class="copy" id="copyBtn" type="button">コードをコピー</button>
        <p class="hint" style="margin-top:12px">次回ご利用時にこのコードをご提示ください。</p>
      </div>
    </div>
  </div>

  <p class="foot">POWERED BY STAR·REVIEWS</p>
</div>

<script>
const qs = new URLSearchParams(location.search);
const slug = qs.get("f");
const token = qs.get("t");
let rating = 0, level = 1, photoKey = null, videoKey = null, videoFile = null, videoOk = false;
const MAX_VIDEO = 60 * 1024 * 1024;

const $ = (id) => document.getElementById(id);

async function load(){
  if(!slug){ $("title").textContent = "リンクが正しくありません"; return; }
  const res = await fetch("/api/public/form/" + encodeURIComponent(slug));
  if(!res.ok){ $("title").textContent = "フォームが見つかりません"; return; }
  const f = await res.json();
  $("brand").textContent = f.business_name || "お客様の声";
  $("title").textContent = f.title;
  $("intro").textContent = f.intro || "";
  $("thanksMsg").textContent = f.thanks_message || "ありがとうございました！";
  renderLevels(f.levels);
  $("form").style.display = "block";
}

function renderLevels(levels){
  const box = $("levels");
  box.innerHTML = "";
  levels.forEach((lv, i) => {
    const el = document.createElement("label");
    el.className = "lv" + (i===0 ? " sel" : "");
    el.innerHTML =
      '<input type="radio" name="lv" value="'+lv.level+'"'+(i===0?" checked":"")+'>' +
      '<div><div class="t">'+lv.label+'</div>'+(lv.reward?'<span class="r">お礼：'+lv.reward+'</span>':'')+'</div>';
    el.querySelector("input").addEventListener("change", () => selectLevel(lv.level, el));
    box.appendChild(el);
  });
  level = levels[0]?.level || 1;
  toggleExtra();
}

function selectLevel(v, el){
  level = v;
  document.querySelectorAll(".lv").forEach(x => x.classList.remove("sel"));
  el.classList.add("sel");
  toggleExtra();
}
function toggleExtra(){
  $("extra").classList.toggle("show", level >= 2);
  $("videoField").style.display = level >= 3 ? "block" : "none";
}

// 動画プレビュー＋検証（60秒・60MB）
$("video").addEventListener("change", () => {
  videoKey = null; videoOk = false; videoFile = null;
  const f = $("video").files[0];
  $("videoHint").textContent = "";
  $("videoPrev").style.display = "none";
  if(!f) return;
  if(f.size > MAX_VIDEO){ $("videoHint").textContent = "⚠️ 60MBを超えています。短く撮り直してください。"; return; }
  const url = URL.createObjectURL(f);
  const v = $("videoPrev");
  v.src = url; v.style.display = "block";
  v.onloadedmetadata = () => {
    if(v.duration && v.duration > 62){ $("videoHint").textContent = "⚠️ 60秒以内にしてください。"; videoOk = false; return; }
    videoFile = f; videoOk = true;
    $("videoHint").textContent = "✓ この動画で送信できます";
  };
});

// stars
$("stars").querySelectorAll("span").forEach(s => {
  s.addEventListener("click", () => {
    rating = +s.dataset.v;
    $("stars").querySelectorAll("span").forEach(x => x.classList.toggle("on", +x.dataset.v <= rating));
  });
});

// photo preview
$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  if(file){ $("photoPrev").src = URL.createObjectURL(file); $("photoPrev").style.display="block"; }
});

function showErr(m){ const e=$("err"); e.textContent=m; e.style.display="block"; }

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").style.display="none";
  if(!rating){ showErr("星で評価を選んでください"); return; }
  if(!$("body").value.trim()){ showErr("ひとことコメントを入力してください"); return; }
  if(level >= 2 && !$("consent").checked){ showErr("掲載の同意にチェックしてください"); return; }
  if(level >= 3 && !videoOk){ showErr("動画をアップロードしてください（60秒・60MBまで）"); return; }

  const btn = $("submit"); btn.disabled = true; btn.textContent = "送信中…";
  try{
    // 写真アップロード（任意）
    const file = level >= 2 ? $("photo").files[0] : null;
    if(file){
      const up = await fetch("/api/public/upload", { method:"POST", headers:{ "content-type": file.type }, body: file });
      const uj = await up.json();
      if(up.ok) photoKey = uj.key;
    }
    // 動画アップロード（Lv3）
    if(level >= 3 && videoFile){
      btn.textContent = "動画を送信中…";
      const uv = await fetch("/api/public/upload-video", { method:"POST", headers:{ "content-type": videoFile.type }, body: videoFile });
      const vj = await uv.json();
      if(!uv.ok){ showErr(vj.error || "動画の送信に失敗しました"); btn.disabled=false; btn.textContent="この内容で送る"; return; }
      videoKey = vj.key;
    }
    const res = await fetch("/api/public/submit", {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({
        slug, level, rating,
        body: $("body").value.trim(),
        author_name: $("name").value.trim(),
        consent_display: level >= 2 ? $("consent").checked : true,
        photo_key: photoKey, video_key: videoKey, token
      })
    });
    const j = await res.json();
    if(!res.ok){ showErr(j.error || "送信に失敗しました"); btn.disabled=false; btn.textContent="この内容で送る"; return; }
    done(j.reward);
  }catch(e){ showErr("通信エラーが発生しました"); btn.disabled=false; btn.textContent="この内容で送る"; }
});

function done(reward){
  $("form").style.display="none";
  $("done").style.display="block";
  if(reward){
    $("rewardBox").style.display="block";
    $("rewardText").textContent = "お礼：" + reward.text;
    $("rewardCode").textContent = reward.code;
    $("copyBtn").addEventListener("click", () => {
      navigator.clipboard?.writeText(reward.code);
      $("copyBtn").textContent = "コピーしました";
    });
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}

load();
</script>
</body>
</html>
