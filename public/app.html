<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ダッシュボード｜star-reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --paper:#fffdf5; --panel:#fff; --ink:#1c1a12; --ink-soft:#413d30; --muted:#7c7563;
    --sun:#ffc62b; --sun-deep:#eaa400; --sun-soft:#ffe7a0; --mark:#ffd84d;
    --line:#ece3cf; --line-strong:#e0d4b6; --ok:#1c7d52; --ok-bg:#e2f3e8;
    --disp:"Space Grotesk",system-ui,sans-serif;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7}
  .top{background:var(--ink);color:#fff}
  .top .in{max-width:940px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .logo{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:16px;color:#fff}
  .logo .star{width:16px;height:16px;color:var(--sun)}
  .logo em{font-style:normal;color:#938b78}
  .biz{font-size:13px;color:#cfc8b6}
  .logout{font-size:12.5px;color:#cfc8b6;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:var(--jp)}
  .logout:hover{color:#fff}
  .tabbar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .tabs{max-width:940px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow:auto}
  .tab{border:0;background:none;padding:15px 14px;font:inherit;font-weight:800;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.14s}
  .tab:hover{color:var(--ink-soft)}
  .tab.on{color:var(--ink);border-color:var(--sun-deep)}
  main{max-width:940px;margin:0 auto;padding:24px 18px 80px}
  @media(max-width:640px){
    .top .in{padding:14px 15px}
    .tabs{padding:0 15px}
    main{padding:24px 15px 80px}
  }
  .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;padding:20px;margin-bottom:16px;
    box-shadow:0 4px 16px rgba(60,46,12,.05)}
  h2{font-size:18px;margin:0 0 15px;font-weight:800;letter-spacing:-.01em}
  h3{font-size:15px;margin:0 0 9px;font-weight:800}
  label{font-size:13px;font-weight:700;display:block;margin:0 0 6px;color:var(--ink-soft)}
  input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line-strong);
    border-radius:11px;padding:11px 13px;font:inherit;background:#fffef9;margin-bottom:12px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px var(--sun-soft)}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .row>*{flex:1;min-width:130px}
  .btn{border:0;border-radius:11px;background:var(--ink);color:#fff;font-weight:800;padding:12px 17px;
    cursor:pointer;font-size:14px;transition:.14s;font-family:var(--jp)}
  .btn:hover{background:#000;transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn.ok{background:var(--ok)}.btn.ok:hover{background:#166543}
  .btn.mut{background:#f0ead9;color:var(--muted)}.btn.mut:hover{background:#e7dfc9;transform:none}
  .btn.sm{padding:8px 14px;font-size:13px}
  .chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin-right:14px;cursor:pointer}
  .chk input{accent-color:var(--sun-deep);width:16px;height:16px}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px}
  .pill.g{background:var(--ok-bg);color:var(--ok)}
  .pill.o{background:var(--sun);color:var(--ink)}
  .pill.n{background:#efe8d7;color:var(--muted)}
  .stars{color:var(--sun-deep);font-size:15px;letter-spacing:1.5px}
  .ti{border:1.5px solid var(--line-strong);border-radius:13px;padding:15px;margin-bottom:12px;background:#fffef9}
  .ti .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ti .body{font-size:14.5px;margin:6px 0 11px;white-space:pre-wrap;color:var(--ink-soft)}
  .ti .who{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .ti img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  .code{background:var(--ink);color:#ffe9a8;border-radius:11px;padding:13px 15px;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow:auto;white-space:pre}
  .copy{margin-top:8px}
  .link{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fbf4e3;
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;word-break:break-all}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px;
    background:var(--panel);border:1.5px dashed var(--line-strong);border-radius:16px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  /* overlay / modal */
  .ov{position:fixed;inset:0;background:rgba(28,26,18,.62);z-index:9998;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
  .ov-card{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .ov-x{float:right;border:0;background:#f0ead9;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink-soft)}
  .ov-x:hover{background:#e7dfc9}
  /* coachmark（チュートリアル） */
  .coach-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(28,26,18,.60);z-index:9991;pointer-events:none;transition:all .22s ease;outline:3px solid var(--sun);outline-offset:2px}
  .coach-tip{position:fixed;z-index:9993;background:#fff;border-radius:14px;padding:16px 18px;max-width:300px;width:calc(100vw - 32px);box-shadow:0 16px 44px rgba(0,0,0,.3)}
  .coach-tip h4{margin:0 0 6px;font-size:15.5px;font-weight:800}
  .coach-tip p{margin:0 0 13px;font-size:13px;color:var(--ink-soft);line-height:1.65}
  .coach-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .coach-dots{font-size:11px;color:var(--muted);font-weight:800;font-family:var(--disp)}
  .coach-skip{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:var(--jp)}
  .coach-next{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:800;cursor:pointer;font-size:13px;font-family:var(--jp)}
  .coach-next:hover{background:#000}
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="logo">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.95 6.3 6.9.86-5.1 4.72 1.36 6.82L12 17.9l-6.06 3.4 1.35-6.82-5.1-4.72 6.9-.86z"/></svg>
    star<em>·</em>reviews
  </span>
  <span><span class="biz" id="bizName"></span> <button class="logout" id="help">使い方</button> <button class="logout" id="logout">ログアウト</button></span>
</div></div>
<div class="tabbar"><div class="tabs" id="tabs">
  <button class="tab on" data-t="forms">フォーム</button>
  <button class="tab" data-t="inbox">受信トレイ</button>
  <button class="tab" data-t="import">インポート</button>
  <button class="tab" data-t="rewards">返礼設定</button>
  <button class="tab" data-t="embed">埋め込み</button>
  <button class="tab" data-t="plan">プラン</button>
</div></div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id)=>document.getElementById(id);
const api = (u,o)=>fetch(u,o).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const esc = (s)=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;};
const stars = (n)=>"★★★★★".slice(0,n|0)+"☆☆☆☆☆".slice(0,5-(n|0));
let STATE = { forms: [], embedToken: null, origin: location.origin, plan: "free", paid: false, billingEnabled: false, hasSub: false, wallSlug: null };
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function copy(text){navigator.clipboard?.writeText(text);toast("コピーしました");}

async function boot(){
  const me = await api("/api/auth/me");
  if(!me.data.authenticated){ location.href="/"; return; }
  STATE.plan = me.data.business?.plan || "free";
  STATE.paid = STATE.plan !== "free";
  STATE.billingEnabled = !!me.data.billing_enabled;
  STATE.hasSub = !!me.data.business?.has_subscription;
  $("bizName").textContent = (me.data.business?.name || "") + (STATE.paid ? "  ·  Pro" : "");
  // Stripe決済からの戻り
  try{
    const q=new URLSearchParams(location.search).get("billing");
    if(q==="success"){ toast("アップグレードが完了しました 🎉"); history.replaceState(null,"","/app"); }
    else if(q==="cancel"){ toast("お手続きはキャンセルされました"); history.replaceState(null,"","/app"); }
  }catch(e){}
  $("logout").onclick = async()=>{ await api("/api/auth/logout",{method:"POST"}); location.href="/"; };
  $("help").onclick = ()=>coach();
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); render(t.dataset.t);
  });
  await loadForms();
  render("forms");
  // 初回のみチュートリアル
  let seen=false; try{ seen=!!localStorage.getItem("sr_tut_v1"); }catch(e){}
  if(!seen) setTimeout(()=>coach(), 450);
}

/* ---------- 選択肢の定義 ---------- */
const STAR_STYLES = [
  ["gold","ゴールド ★"],["mono","モノクロ ★"],["emoji","絵文字 ⭐"],["heart","ハート ❤"],["number","数値 4.8/5"],
  ["big","ビッグ ★（特大）"],["glow","グロー（発光）"],["shine","シャイン（きらめき）"],["metal","メタリック金"],["mini","ミニ ★（極小）"]
];
const LAYOUTS = [
  ["grid","グリッド（タイル状）"],["carousel","カルーセル（横スクロール）"],["list","リスト（縦1列）"],["chips","チップス（小カードを敷き詰め）"]
];

/* ---------- 初回チュートリアル（スポットライト式・スキップ可） ---------- */
function coach(){
  const steps=[
    {sel:null, title:"ようこそ 👋", body:"star-reviews の使い方を30秒でご案内します。いつでもスキップできます。"},
    {sel:'.tab[data-t="forms"]', title:"① フォームを作る", body:"投稿フォームを作り、LINEやメールにリンクを貼ってお客様に声を書いてもらいます。匿名でもOKです。"},
    {sel:'.tab[data-t="inbox"]', title:"② 届いた声を選ぶ", body:"受信トレイで内容を確認し、掲載したい良い声だけ「掲載する」で承認します。"},
    {sel:'.tab[data-t="import"]', title:"③ 掲載を選ぶ", body:"集まったレビューを並び替えて、サイトに載せたいものを選べます。本文は編集できないので、いただいた声をそのまま安心して掲載できます。"},
    {sel:'.tab[data-t="embed"]', title:"④ サイトに貼る", body:"タグを1行コピーして貼るだけ。★の種類・レイアウト・テーマも選べます。"},
  ];
  let i=0;
  const spot=document.createElement("div"); spot.className="coach-spot";
  const tip=document.createElement("div"); tip.className="coach-tip";
  const center=document.createElement("div"); center.className="ov"; center.style.zIndex=9992; center.style.alignItems="center";
  function done(){ try{localStorage.setItem("sr_tut_v1","1");}catch(e){} [spot,tip,center].forEach(e=>e.remove()); }
  function show(){
    const s=steps[i];
    if(!s.sel){
      spot.remove();
      center.innerHTML=`<div class="coach-tip" style="position:static;max-width:360px;text-align:center;width:auto">
        <h4>${s.title}</h4><p>${s.body}</p>
        <div class="coach-row" style="justify-content:center">
          <button class="coach-skip" id="c_skip">スキップ</button>
          <button class="coach-next" id="c_next">はじめる</button></div></div>`;
      document.body.appendChild(center);
      center.querySelector("#c_skip").onclick=done;
      center.querySelector("#c_next").onclick=()=>{ i++; show(); };
      return;
    }
    center.remove();
    const el=document.querySelector(s.sel);
    if(!el){ i++; return i<steps.length?show():done(); }
    el.scrollIntoView({block:"nearest",inline:"center"});
    const r=el.getBoundingClientRect(), pad=6;
    Object.assign(spot.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"});
    if(!spot.parentNode) document.body.appendChild(spot);
    if(!tip.parentNode) document.body.appendChild(tip);
    tip.innerHTML=`<h4>${s.title}</h4><p>${s.body}</p>
      <div class="coach-row"><span class="coach-dots">${i} / ${steps.length-1}</span>
      <span style="display:flex;gap:10px;align-items:center"><button class="coach-skip" id="c_skip">スキップ</button>
      <button class="coach-next" id="c_next">${i===steps.length-1?"完了":"次へ"}</button></span></div>`;
    tip.style.top=(r.bottom+12)+"px";
    tip.style.left=Math.max(12,Math.min(r.left, window.innerWidth-312))+"px";
    tip.querySelector("#c_skip").onclick=done;
    tip.querySelector("#c_next").onclick=()=>{ i++; i<steps.length?show():done(); };
  }
  show();
}

/* ---------- LINE共有 / QRコード ---------- */
function lineShare(url){
  const msg = "お客様の声をぜひお聞かせください：\n" + url;
  window.open("https://line.me/R/msg/text/?" + encodeURIComponent(msg), "_blank", "noopener");
}
function showQR(url){
  let qrHtml = `<p class="muted">QRの生成に失敗しました</p>`;
  try{
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    qrHtml = `<img alt="QRコード" src="${qr.createDataURL(7,10)}" style="width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px">`;
  }catch(e){}
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="ov-card" style="max-width:340px;text-align:center">
    <button class="ov-x" id="qx">✕</button>
    <h2 style="margin:0 0 4px">QRコード</h2>
    <p class="muted" style="margin:0 0 14px">店頭やチラシ・レシートに印刷して、お客様に読み取ってもらえます。</p>
    ${qrHtml}
    <div class="link" style="margin-top:12px">${esc(url)}</div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#qx").onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
}

/* ---------- ★の種類 見本モーダル ---------- */
function openStarSamples(){
  const cards = STAR_STYLES.map(([s,label])=>`
    <div style="border:1px solid var(--line-strong);border-radius:13px;padding:13px;background:#fffdf5">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px">
        <span style="font-weight:800;font-size:13px">${label}</span>
        <code style="font-size:10.5px;color:var(--muted)">data-star="${s}"</code>
      </div>
      <div style="display:flex;align-items:center;gap:12px">${pvStars(5,s)} ${pvStars(4,s)}</div>
    </div>`).join("");
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="ov-card"><style>${PV_CSS}</style>
    <button class="ov-x" id="ov_x">✕</button>
    <h2 style="margin:0 0 4px">★の種類 見本</h2>
    <p class="muted" style="margin:0 0 16px">埋め込みで選べる★スタイルの一覧です。グロー／シャインは実際に動きます。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${cards}</div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("#ov_x").onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
}

async function loadForms(){
  const r = await api("/api/forms");
  STATE.forms = r.data.forms || [];
  STATE.embedToken = STATE.forms.find(f=>f.embed_token)?.embed_token || null;
  STATE.wallSlug = STATE.forms.find(f=>f.wall_slug)?.wall_slug || null;
  STATE.wallViews = STATE.forms[0]?.wall_views || 0;
}

function render(tab){
  if(tab==="forms") return renderForms();
  if(tab==="inbox") return renderInbox();
  if(tab==="import") return renderImport();
  if(tab==="rewards") return renderRewards();
  if(tab==="embed") return renderEmbed();
  if(tab==="plan") return renderPlan();
}

/* ---------- ホスト型・声の壁ページ(SEO) + プラン ---------- */
function wallPageUrl(){
  const id = STATE.wallSlug || STATE.embedToken;
  return id ? STATE.origin + "/wall/" + id : null;
}
function renderHostedCard(){
  const url = wallPageUrl();
  if(!url) return "";
  const slugUI = STATE.paid
    ? `<div class="row" style="margin-top:10px"><div style="flex:1">
         <label>独自URL（Pro特典）</label>
         <div style="display:flex;gap:8px">
           <span style="align-self:center;color:var(--muted);font-size:13px">${esc(STATE.origin)}/wall/</span>
           <input id="wp_slug" placeholder="my-shop" value="${esc(STATE.wallSlug||"")}" style="flex:1">
           <button class="btn ghost sm" id="wp_save">保存</button>
         </div>
         <p class="muted" style="margin:6px 0 0;font-size:11.5px">半角英数字とハイフンで3〜40字。設定すると覚えやすいURLになります。</p>
       </div></div>`
    : `<p class="muted" style="margin:10px 0 0;font-size:12px">覚えやすい独自URL（例: /wall/my-shop）は <a style="color:var(--sun-deep);cursor:pointer;text-decoration:underline" id="wp_toplan">Pro</a> で設定できます。</p>`;
  return `<div class="card">
      <h2>ホスト型・声の壁ページ</h2>
      <p class="muted" style="margin-top:-8px">サイトを持っていなくてもOK。この公開URLをInstagram・LINE・名刺・Googleマップに貼るだけで「お客様の声ページ」になります。Google検索にも載る構造化データ入りです。</p>
      <label>公開URL</label>
      <div class="code" id="wp_url">${esc(url)}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ghost sm" id="wp_copy">URLをコピー</button>
        <a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener">ページを開く</a>
      </div>
      ${slugUI}
    </div>`;
}
function bindHostedCard(){
  const url = wallPageUrl();
  if($("wp_copy")) $("wp_copy").onclick = ()=>copy(url);
  if($("wp_toplan")) $("wp_toplan").onclick = ()=>{ document.querySelector('.tab[data-t="plan"]').click(); };
  if($("wp_save")) $("wp_save").onclick = async()=>{
    const slug = ($("wp_slug").value||"").trim().toLowerCase();
    if(!slug){ toast("URLを入力してください"); return; }
    const r = await api("/api/walls/slug",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slug})});
    if(r.ok){ STATE.wallSlug = r.data.slug; toast("独自URLを保存しました"); renderEmbed(); }
    else { toast(r.data.error || "保存に失敗しました"); }
  };
}

function renderPlan(){
  const paid = STATE.paid;
  const benefits = [
    ["声の壁の「star-reviews」クレジット非表示（ホワイトラベル）", true],
    ["声の壁ページの独自URL（/wall/あなたの店名）", true],
    ["フォーム・収集・掲載・動画レビュー・インポート", false],
    ["Google検索向けの構造化データ(JSON-LD)", false],
  ];
  const planBadge = paid
    ? `<span class="pill g" style="font-size:13px">現在のプラン：Pro</span>`
    : `<span class="pill o" style="font-size:13px">現在のプラン：Free</span>`;
  const setupNote = STATE.billingEnabled ? "" :
    `<p class="muted" style="margin:10px 0 0;font-size:12px">※ 現在オンライン決済は準備中です（管理者がStripeを設定すると有効になります）。</p>`;
  const action = paid
    ? `<button class="btn ghost" id="pl_portal">プラン・お支払いを管理</button>`
    : `<button class="btn" id="pl_upgrade">Proにアップグレード</button>`;
  $("view").innerHTML = `

async function startCheckout(){
  const btn=$("pl_upgrade"); if(btn){btn.disabled=true;btn.textContent="準備中…";}
  const r = await api("/api/billing/checkout",{method:"POST"});
  if(r.ok && r.data.url){ location.href = r.data.url; return; }
  if(r.data.setup_required){ toast("オンライン決済は準備中です"); }
  else { toast(r.data.error || "エラーが発生しました"); }
  if(btn){btn.disabled=false;btn.textContent="Proにアップグレード";}
}
async function openPortal(){
  const r = await api("/api/billing/portal",{method:"POST"});
  if(r.ok && r.data.url){ location.href = r.data.url; return; }

}

    : (t.status==="approved" ? `<button class="btn mut sm act" data-id="${t.id}" data-a="reject">掲載を外す</button>` : "");

      $("g_note").textContent = `${r.data.imported||0}件を掲載しました。`;
      await loadForms(); load();
    };
  }

function buildSnippet(o){
  const attrs = [`data-token="${STATE.embedToken}"`];
  if(o.layout && o.layout!=="grid") attrs.push(`data-layout="${o.layout}"`);
  if(o.star && o.star!=="gold") attrs.push(`data-star="${o.star}"`);
  if(o.theme && o.theme!=="light") attrs.push(`data-theme="${o.theme}"`);
  if(!o.summary) attrs.push(`data-summary="off"`);
  return `<script src="${STATE.origin}/widget.js" ${attrs.join(" ")} async><\/script>`;
}
// プレビュー用の★描画
function pvStars(v, star){
  v=Math.max(0,Math.min(5,v||0));
  if(star==="number") return `<span class="pv-st pv-num">★ ${v.toFixed(1)}<span style="color:#9a917c">/5</span></span>`;
  const n=Math.round(v);
  if(star==="emoji") return `<span class="pv-st">${"⭐".repeat(n)}</span>`;
  const g={gold:["★","☆"],mono:["★","☆"],heart:["❤","♡"]}[star]||["★","☆"];
  const cls={mono:"pv-mono",heart:"pv-heart",big:"pv-big",glow:"pv-glow",shine:"pv-shine",metal:"pv-metal",mini:"pv-mini"}[star]||"pv-gold";
  return `<span class="pv-st ${cls}"><span class="f">${g[0].repeat(n)}</span><span class="e">${g[1].repeat(5-n)}</span></span>`;
}

  .pv-chips{display:flex;flex-wrap:wrap;gap:10px}.pv-chips .pv-card{flex:0 1 220px}
  @media(prefers-reduced-motion:reduce){.pv-glow .f,.pv-shine .f{animation:none}}`;
const PV_ITEMS = [
  {rating:5, body:"スタッフの対応がとても丁寧で、初めてでも安心して任せられました。", author:"M.T様", verified:true, source:"Google"},
  {rating:4, body:"予約が取りやすく、居心地がよかったです。また来ます！", author:"匿名希望", verified:false, source:""}
];
function pvRender(o){
  const th = o.theme||"light";
  const lay = o.layout==="carousel"?"pv-carousel":o.layout==="list"?"pv-list":o.layout==="chips"?"pv-chips":"pv-grid";
  let h = `<style>${PV_CSS}</style><div class="pv-root pv-theme-${th}">`;
  if(o.summary){
    h += `<div class="pv-sum">${o.star!=="number"?`<span class="pv-sum-avg">4.8</span>`:""}<span>${pvStars(4.8,o.star)}<br><span class="pv-sum-c">128件のお客様の声</span></span></div>`;
  }
  h += `<div class="${lay}">` + PV_ITEMS.map(it=>{
    const ini = it.author && it.author!=="匿名希望" ? it.author.charAt(0) : "★";
    return `<div class="pv-card"><div class="pv-top">${pvStars(it.rating,o.star)}${it.source?`<span class="pv-src">via ${esc(it.source)}</span>`:""}</div>`+
      `<div class="pv-body">${esc(it.body)}</div>`+
      `<div class="pv-foot"><span class="pv-av">${esc(ini)}</span><span class="pv-who">${esc(it.author)}</span>${it.verified?`<span class="pv-bd">確認済み</span>`:""}</div></div>`;
  }).join("") + `</div></div>`;
  return h;
}
function renderEmbed(){
  if(!STATE.embedToken){ $("view").innerHTML=`<div class="empty">先にフォームを作成すると、埋め込みコードが発行されます。</div>`; return; }
  $("view").innerHTML = `
    <div class="card" style="background:var(--ink);color:#fff;border:0">
      <p style="margin:0;font-size:12.5px;color:#cfc8b6;font-weight:700;letter-spacing:.04em">声の壁の表示回数</p>
      <p style="margin:4px 0 0;font-size:34px;font-weight:800;font-family:var(--disp)">${(STATE.wallViews||0).toLocaleString()}<span style="font-size:15px;color:#cfc8b6;font-weight:700;font-family:var(--jp)"> 回</span></p>
    </div>
    ${renderHostedCard()}
    <div class="card">
      <h2>サイトに「声の壁」を貼る</h2>
      <p class="muted" style="margin-top:-8px">見せ方を選ぶと下にプレビューが出ます。気に入ったらコードをコピーして貼るだけ。</p>
      <div class="row">
        <div><label>レイアウト</label><select id="em_layout">${LAYOUTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
        <div><label>★マークの種類 <a id="em_samples" style="font-weight:800;color:var(--sun-deep);cursor:pointer;text-decoration:underline;font-size:12px">見本を見る</a></label><select id="em_star">${STAR_STYLES.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
      </div>
      <div class="row">
        <div><label>テーマ（カードの見せ方）</label><select id="em_theme">
          <option value="light">ライト（白カード）</option>
          <option value="minimal">ミニマル（罫線のみ）</option>
          <option value="quote">引用（大きな “）</option>
          <option value="dark">ダーク</option>
        </select></div>
        <div><label>星サマリー（平均★と件数）</label><select id="em_summary">
          <option value="1">表示する</option><option value="0">表示しない</option>
        </select></div>
      </div>
      <label style="margin-top:4px">プレビュー</label>
      <div class="pv-wrap" id="em_prev"></div>
      <label style="margin-top:14px">埋め込みコード</label>
      <div class="code" id="snip"></div>
      <button class="btn ghost sm copy" id="em_copy" style="margin-top:11px">コードをコピー</button>
    </div>
    <div class="card">
      <h3>置き場所を指定したいとき</h3>
      <p class="muted" style="margin-top:-6px">表示したい場所に下のタグを置くと、そこに描画されます。</p>
      <div class="code">${esc('<div data-star-reviews></div>')}</div>
    </div>
    <div class="card">
      <h3>Google検索に★を表示（SEO）</h3>
      <p class="muted" style="margin-top:-6px">このタグを貼ると、レビューの構造化データ(JSON-LD)も自動で出力され、Google検索で★リッチスニペットの対象になります（反映はGoogleの判断・数日〜）。不要なら <code>data-schema="off"</code> を足してください。</p>
    </div>`;
  const opts=()=>({layout:$("em_layout").value,star:$("em_star").value,theme:$("em_theme").value,summary:$("em_summary").value==="1"});
  const update=()=>{
    const o=opts();
    $("em_prev").innerHTML = pvRender(o);
    const snip = buildSnippet(o);
    $("snip").textContent = snip;
    $("em_copy").onclick = ()=>copy(snip);
  };
  ["em_layout","em_star","em_theme","em_summary"].forEach(id=>$(id).onchange=update);
  $("em_samples").onclick = openStarSamples;
  bindHostedCard();
  update();
}

boot();
</script>
</body>
</html>
