<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ダッシュボード｜star-reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --paper:#fffdf5; --panel:#fff; --ink:#1c1a12; --ink-soft:#413d30; --muted:#7c7563;
    --sun:#ffc62b; --sun-deep:#eaa400; --sun-soft:#ffe7a0; --mark:#ffd84d;
    --line:#ece3cf; --line-strong:#e0d4b6; --ok:#1c7d52; --ok-bg:#e2f3e8;
    --disp:"Space Grotesk",system-ui,sans-serif;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7}
  .top{background:var(--ink);color:#fff}
  .top .in{max-width:940px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .logo{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:16px;color:#fff}
  .logo .star{width:16px;height:16px;color:var(--sun)}
  .logo em{font-style:normal;color:#938b78}
  .biz{font-size:13px;color:#cfc8b6}
  .logout{font-size:12.5px;color:#cfc8b6;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:var(--jp)}
  .logout:hover{color:#fff}
  .storesel{background:#2a2617;color:#fff;border:1px solid #4b4431;border-radius:9px;padding:6px 10px;
    font:inherit;font-size:13px;font-weight:700;max-width:180px;margin-right:6px;cursor:pointer}
  .storesel:focus{outline:none;border-color:var(--sun)}
  .tabbar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .tabs{max-width:940px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow:auto}
  .tab{border:0;background:none;padding:15px 14px;font:inherit;font-weight:800;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.14s}
  .tab:hover{color:var(--ink-soft)}
  .tab.on{color:var(--ink);border-color:var(--sun-deep)}
  main{max-width:940px;margin:0 auto;padding:24px 18px 80px}
  @media(max-width:640px){
    .top .in{padding:14px 15px}
    .tabs{padding:0 15px}
    main{padding:24px 15px 80px}
  }
  .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;padding:20px;margin-bottom:16px;
    box-shadow:0 4px 16px rgba(60,46,12,.05)}
  h2{font-size:18px;margin:0 0 15px;font-weight:800;letter-spacing:-.01em}
  h3{font-size:15px;margin:0 0 9px;font-weight:800}
  label{font-size:13px;font-weight:700;display:block;margin:0 0 6px;color:var(--ink-soft)}
  input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line-strong);
    border-radius:11px;padding:11px 13px;font:inherit;background:#fffef9;margin-bottom:12px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px var(--sun-soft)}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .row>*{flex:1;min-width:130px}
  .btn{border:0;border-radius:11px;background:var(--ink);color:#fff;font-weight:800;padding:12px 17px;
    cursor:pointer;font-size:14px;transition:.14s;font-family:var(--jp)}
  .btn:hover{background:#000;transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn.ok{background:var(--ok)}.btn.ok:hover{background:#166543}
  .btn.mut{background:#f0ead9;color:var(--muted)}.btn.mut:hover{background:#e7dfc9;transform:none}
  .btn.sm{padding:8px 14px;font-size:13px}
  .chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin-right:14px;cursor:pointer}
  .chk input{accent-color:var(--sun-deep);width:16px;height:16px}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px}
  .pill.g{background:var(--ok-bg);color:var(--ok)}
  .pill.o{background:var(--sun);color:var(--ink)}
  .pill.n{background:#efe8d7;color:var(--muted)}
  .stars{color:var(--sun-deep);font-size:15px;letter-spacing:1.5px}
  .ti{border:1.5px solid var(--line-strong);border-radius:13px;padding:15px;margin-bottom:12px;background:#fffef9}
  .ti .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ti .body{font-size:14.5px;margin:6px 0 11px;white-space:pre-wrap;color:var(--ink-soft)}
  .ti .who{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .ti img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  .code{background:var(--ink);color:#ffe9a8;border-radius:11px;padding:13px 15px;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow:auto;white-space:pre}
  .copy{margin-top:8px}
  .link{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fbf4e3;
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;word-break:break-all}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px;
    background:var(--panel);border:1.5px dashed var(--line-strong);border-radius:16px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  /* overlay / modal */
  .ov{position:fixed;inset:0;background:rgba(28,26,18,.62);z-index:9998;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
  .ov-card{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .ov-x{float:right;border:0;background:#f0ead9;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink-soft)}
  .ov-x:hover{background:#e7dfc9}
  /* coachmark（チュートリアル） */
  .coach-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(28,26,18,.60);z-index:9991;pointer-events:none;transition:all .22s ease;outline:3px solid var(--sun);outline-offset:2px}
  .coach-tip{position:fixed;z-index:9993;background:#fff;border-radius:14px;padding:16px 18px;max-width:300px;width:calc(100vw - 32px);box-shadow:0 16px 44px rgba(0,0,0,.3)}
  .coach-tip h4{margin:0 0 6px;font-size:15.5px;font-weight:800}
  .coach-tip p{margin:0 0 13px;font-size:13px;color:var(--ink-soft);line-height:1.65}
  .coach-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .coach-dots{font-size:11px;color:var(--muted);font-weight:800;font-family:var(--disp)}
  .coach-skip{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:var(--jp)}
  .coach-next{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:800;cursor:pointer;font-size:13px;font-family:var(--jp)}
  .coach-next:hover{background:#000}
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="logo">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.95 6.3 6.9.86-5.1 4.72 1.36 6.82L12 17.9l-6.06 3.4 1.35-6.82-5.1-4.72 6.9-.86z"/></svg>
    star<em>·</em>reviews
  </span>
  <span>
    <select id="storeSel" class="storesel" style="display:none"></select>
    <span class="biz" id="bizName"></span>
    <button class="logout" id="help">使い方</button> <button class="logout" id="logout">ログアウト</button>
  </span>
</div></div>
<div class="tabbar"><div class="tabs" id="tabs">
  <button class="tab on" data-t="forms">フォーム</button>
  <button class="tab" data-t="inbox">受信トレイ</button>
  <button class="tab" data-t="analytics">アナリティクス</button>
  <button class="tab" data-t="followup">フォローアップ</button>
  <button class="tab" data-t="import">インポート</button>
  <button class="tab" data-t="rewards">返礼設定</button>
  <button class="tab" data-t="embed">埋め込み</button>
  <button class="tab" data-t="stores">店舗</button>
  <button class="tab" data-t="plan">プラン</button>
  <button class="tab" data-t="notify">通知</button>
</div></div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id)=>document.getElementById(id);
const api = (u,o)=>fetch(u,o).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const esc = (s)=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;};
const stars = (n)=>"★★★★★".slice(0,n|0)+"☆☆☆☆☆".slice(0,5-(n|0));
let STATE = { forms: [], embedToken: null, origin: location.origin, plan: "free", paid: false, billingEnabled: false, hasSub: false, wallSlug: null };
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function copy(text){navigator.clipboard?.writeText(text);toast("コピーしました");}

async function boot(){
  const me = await api("/api/auth/me");
  if(!me.data.authenticated){ location.href="/"; return; }
  STATE.plan = me.data.business?.plan || "free";
  STATE.paid = STATE.plan !== "free";
  STATE.billingEnabled = !!me.data.billing_enabled;
  STATE.hasSub = !!me.data.business?.has_subscription;
  $("bizName").textContent = (me.data.business?.name || "") + (STATE.paid ? ("  ·  " + (STATE.plan==="pro"?"Pro":"Starter")) : "");
  // Stripe決済からの戻り
  try{
    const q=new URLSearchParams(location.search).get("billing");
    if(q==="success"){ toast("アップグレードが完了しました 🎉"); history.replaceState(null,"","/app"); }
    else if(q==="cancel"){ toast("お手続きはキャンセルされました"); history.replaceState(null,"","/app"); }
  }catch(e){}
  $("logout").onclick = async()=>{ await api("/api/auth/logout",{method:"POST"}); location.href="/"; };
  $("help").onclick = ()=>coach();
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); render(t.dataset.t);
  });
  await loadStores();
  await loadForms();
  render("forms");
  // 初回のみチュートリアル
  let seen=false; try{ seen=!!localStorage.getItem("sr_tut_v1"); }catch(e){}
  if(!seen) setTimeout(()=>coach(), 450);
}

/* ---------- 選択肢の定義 ---------- */
const STAR_STYLES = [
  ["gold","ゴールド ★"],["mono","モノクロ ★"],["emoji","絵文字 ⭐"],["heart","ハート ❤"],["number","数値 4.8/5"],
  ["big","ビッグ ★（特大）"],["glow","グロー（発光）"],["shine","シャイン（きらめき）"],["metal","メタリック金"],["mini","ミニ ★（極小）"]
];
const LAYOUTS = [
  ["grid","グリッド（タイル状）"],["carousel","カルーセル（横スクロール）"],["list","リスト（縦1列）"],["chips","チップス（小カードを敷き詰め）"]
];

/* ---------- 初回チュートリアル（スポットライト式・スキップ可） ---------- */
function coach(){
  const steps=[
    {sel:null, title:"ようこそ 👋", body:"star-reviews の使い方を30秒でご案内します。いつでもスキップできます。"},
    {sel:'.tab[data-t="forms"]', title:"① フォームを作る", body:"投稿フォームを作り、LINEやメールにリンクを貼ってお客様に声を書いてもらいます。匿名でもOKです。"},
    {sel:'.tab[data-t="inbox"]', title:"② 届いた声を選ぶ", body:"受信トレイで内容を確認し、掲載したい良い声だけ「掲載する」で承認します。"},
    {sel:'.tab[data-t="import"]', title:"③ 掲載を選ぶ", body:"集まったレビューを並び替えて、サイトに載せたいものを選べます。本文は編集できないので、いただいた声をそのまま安心して掲載できます。"},
    {sel:'.tab[data-t="embed"]', title:"④ サイトに貼る", body:"タグを1行コピーして貼るだけ。★の種類・レイアウト・テーマも選べます。"},
  ];
  let i=0;
  const spot=document.createElement("div"); spot.className="coach-spot";
  const tip=document.createElement("div"); tip.className="coach-tip";
  const center=document.createElement("div"); center.className="ov"; center.style.zIndex=9992; center.style.alignItems="center";
  function done(){ try{localStorage.setItem("sr_tut_v1","1");}catch(e){} [spot,tip,center].forEach(e=>e.remove()); }
  function show(){
    const s=steps[i];
    if(!s.sel){
      spot.remove();
      center.innerHTML=`<div class="coach-tip" style="position:static;max-width:360px;text-align:center;width:auto">
        <h4>${s.title}</h4><p>${s.body}</p>
        <div class="coach-row" style="justify-content:center">
          <button class="coach-skip" id="c_skip">スキップ</button>
          <button class="coach-next" id="c_next">はじめる</button></div></div>`;
      document.body.appendChild(center);
      center.querySelector("#c_skip").onclick=done;
      center.querySelector("#c_next").onclick=()=>{ i++; show(); };
      return;
    }
    center.remove();
    const el=document.querySelector(s.sel);
    if(!el){ i++; return i<steps.length?show():done(); }
    el.scrollIntoView({block:"nearest",inline:"center"});
    const r=el.getBoundingClientRect(), pad=6;
    Object.assign(spot.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"});
    if(!spot.parentNode) document.body.appendChild(spot);
    if(!tip.parentNode) document.body.appendChild(tip);
    tip.innerHTML=`<h4>${s.title}</h4><p>${s.body}</p>
      <div class="coach-row"><span class="coach-dots">${i} / ${steps.length-1}</span>
      <span style="display:flex;gap:10px;align-items:center"><button class="coach-skip" id="c_skip">スキップ</button>
      <button class="coach-next" id="c_next">${i===steps.length-1?"完了":"次へ"}</button></span></div>`;
    tip.style.top=(r.bottom+12)+"px";
    tip.style.left=Math.max(12,Math.min(r.left, window.innerWidth-312))+"px";
    tip.querySelector("#c_skip").onclick=done;
    tip.querySelector("#c_next").onclick=()=>{ i++; i<steps.length?show():done(); };
  }
  show();
}

/* ---------- LINE共有 / QRコード ---------- */
function lineShare(url){
  const msg = "お客様の声をぜひお聞かせください：\n" + url;
  window.open("https://line.me/R/msg/text/?" + encodeURIComponent(msg), "_blank", "noopener");
}
function showQR(url){
  let qrHtml = `<p class="muted">QRの生成に失敗しました</p>`;
  try{
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    qrHtml = `<img alt="QRコード" src="${qr.createDataURL(7,10)}" style="width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px">`;
  }catch(e){}
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="ov-card" style="max-width:340px;text-align:center">
    <button class="ov-x" id="qx">✕</button>
    <h2 style="margin:0 0 4px">QRコード</h2>
    <p class="muted" style="margin:0 0 14px">店頭やチラシ・レシートに印刷して、お客様に読み取ってもらえます。</p>
    ${qrHtml}
    <div class="link" style="margin-top:12px">${esc(url)}</div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#qx").onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
}

/* ---------- ★の種類 見本モーダル ---------- */
function openStarSamples(){
  const cards = STAR_STYLES.map(([s,label])=>`
    <div style="border:1px solid var(--line-strong);border-radius:13px;padding:13px;background:#fffdf5">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px">
        <span style="font-weight:800;font-size:13px">${label}</span>
        <code style="font-size:10.5px;color:var(--muted)">data-star="${s}"</code>
      </div>
      <div style="display:flex;align-items:center;gap:12px">${pvStars(5,s)} ${pvStars(4,s)}</div>
    </div>`).join("");
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="ov-card"><style>${PV_CSS}</style>
    <button class="ov-x" id="ov_x">✕</button>
    <h2 style="margin:0 0 4px">★の種類 見本</h2>
    <p class="muted" style="margin:0 0 16px">埋め込みで選べる★スタイルの一覧です。グロー／シャインは実際に動きます。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${cards}</div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("#ov_x").onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
}

async function loadForms(){
  const r = await api("/api/forms");
  STATE.forms = r.data.forms || [];
  STATE.embedToken = STATE.forms.find(f=>f.embed_token)?.embed_token || null;
  STATE.wallSlug = STATE.forms.find(f=>f.wall_slug)?.wall_slug || null;
  STATE.wallViews = STATE.forms[0]?.wall_views || 0;
}

function render(tab){
  if(tab==="forms") return renderForms();
  if(tab==="inbox") return renderInbox();
  if(tab==="analytics") return renderAnalytics();
  if(tab==="followup") return renderFollowup();
  if(tab==="import") return renderImport();
  if(tab==="rewards") return renderRewards();
  if(tab==="embed") return renderEmbed();
  if(tab==="stores") return renderStores();
  if(tab==="plan") return renderPlan();
  if(tab==="notify") return renderNotify();
}

/* ---------- 店舗（複数店舗の管理） ---------- */
async function loadStores(){
  const r = await api("/api/stores");
  if(!r.ok){ STATE.stores=[]; return; }
  STATE.stores = r.data.stores || [];
  STATE.storeIsPro = !!r.data.is_pro;
  STATE.storeCanCreate = !!r.data.can_create;
  STATE.storeLimit = r.data.limit || 5;
  const sel = $("storeSel");
  if(!sel) return;
  const active = STATE.stores.filter(s=>!s.archived);
  if(active.length >= 2){
    sel.innerHTML = active.map(s=>`<option value="${s.id}" ${s.active?"selected":""}>${esc(s.name)}</option>`).join("");
    sel.style.display=""; if($("bizName")) $("bizName").style.display="none";
    sel.onchange = ()=>switchStore(sel.value);
  } else {
    sel.style.display="none"; if($("bizName")) $("bizName").style.display="";
  }
}
async function switchStore(id){
  const r = await api("/api/stores/switch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({businessId:id})});
  if(r.ok){ location.reload(); } else { toast(r.data.error||"切り替えに失敗しました"); }
}
function renderStores(){
  const v=$("view"); const limit=STATE.storeLimit||5;
  const stores=STATE.stores||[]; const activeCount=stores.filter(s=>!s.archived).length;
  const rows=stores.map(s=>{
    const badge=s.active?`<span class="pill o">表示中</span>`:(s.archived?`<span class="pill n">アーカイブ</span>`:"");
    const a=[];
    if(!s.active && !s.archived) a.push(`<button class="btn ghost sm" data-switch="${s.id}">表示切替</button>`);
    if(!s.archived) a.push(`<button class="btn ghost sm" data-rename="${s.id}">名前変更</button>`);
    if(!s.archived && !s.has_subscription && activeCount>1) a.push(`<button class="btn mut sm" data-archive="${s.id}">アーカイブ</button>`);
    if(s.archived) a.push(`<button class="btn ghost sm" data-unarchive="${s.id}">戻す</button>`);
    return `<div class="ti"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><b style="font-size:15px">${esc(s.name)}</b> ${badge}
        <div class="muted" style="margin-top:3px">掲載 ${s.approved_count} 件 ・ 承認待ち ${s.pending_count} 件</div></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">${a.join("")}</div></div></div>`;
  }).join("");
  const createBlock = STATE.storeIsPro
    ? `<div class="row" style="margin-top:4px"><input type="text" id="newStore" placeholder="新しい店舗名（例: 2号店）" ${activeCount>=limit?"disabled":""}>
        <button class="btn" id="addStore" style="flex:0 0 auto" ${activeCount>=limit?"disabled":""}>店舗を追加</button></div>
       <p class="muted" style="margin-top:8px">${activeCount>=limit?`上限（${limit}店舗）に達しています。`:`あと ${limit-activeCount} 店舗まで追加できます。`}</p>`

/* ---------- アナリティクス ---------- */
function anaEmpty(msg){ return `<div class="empty" style="padding:22px">${msg||"まだデータがありません"}</div>`; }
function lineSVG(series){
  if(!series||series.length===0) return anaEmpty();
  const W=620,H=130,p=24;
  const max=Math.max(1,...series.map(s=>s.n));
  const xs=series.map((_,i)=>series.length>1?p+i*(W-2*p)/(series.length-1):W/2);
  const ys=series.map(s=>H-p-(s.n/max)*(H-2*p));
  const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="var(--sun-deep)"/>`).join("");
  const area=`${xs[0].toFixed(1)},${H-p} ${pts} ${xs[xs.length-1].toFixed(1)},${H-p}`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:160px">
    <polygon points="${area}" fill="var(--sun-soft)" opacity="0.55"/>
    <polyline points="${pts}" fill="none" stroke="var(--sun-deep)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${p}" y="14" font-size="10" fill="var(--muted)">最大 ${max}</text>
    <text x="${p}" y="${H-6}" font-size="10" fill="var(--muted)">${(series[0].day||"").slice(5)}</text>
    <text x="${W-p}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${(series[series.length-1].day||"").slice(5)}</text>
  </svg>`;
}
function barsHTML(pairs){
  if(!pairs||pairs.length===0) return anaEmpty();
  const max=Math.max(1,...pairs.map(p=>p[1]));
  return `<div style="display:flex;flex-direction:column;gap:7px;margin-top:6px">`+pairs.map(p=>`
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:92px;font-size:12.5px;color:var(--ink-soft);text-align:right;flex:0 0 auto">${esc(String(p[0]))}</span>
      <span style="flex:1;background:#f3edda;border-radius:7px;height:18px;position:relative;overflow:hidden">

      <span style="width:38px;font-size:12.5px;font-weight:800;flex:0 0 auto">${p[1]}</span></div>`).join("")+`</div>`;
}
function funnelHTML(f){

/* ---------- CSV パース & テンプレDL ---------- */
function parseCsvText(text){
  // BOM除去
  text = text.replace(/^﻿/, "");
  const rows=[]; let row=[]; let cur=""; let q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else { q=false; } }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==="\r"){ /* skip */ }
      else cur+=c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> r.some(x=> (x||"").trim()!==""));
}
function parseTestimonialCsv(text){
  const rows = parseCsvText(text);
  if(!rows.length) return [];
  // 見出し行判定: 2列目(評価)が数値でなければ見出しとみなしスキップ
  let start=0;
  const r0=rows[0]||[];
  const ratingLooksNum = /^[1-5]$/.test((r0[1]||"").trim());
  if(!ratingLooksNum) start=1;
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    const author_name=(r[0]||"").trim();
    const rating=parseInt((r[1]||"").trim(),10);
    const body=(r[2]||"").trim();
    const date=(r[3]||"").trim();
    if(!(rating>=1&&rating<=5) || !body) continue;
    out.push({author_name, rating, body, date});
  }
  return out;
}
function downloadCsvTemplate(){
  const sample =
    "名前,評価,コメント,日付\n" +
    "田中 太郎,5,接客がとても丁寧で安心して任せられました。,2026-10-01\n" +
    "匿名,4,価格以上の仕上がりでした。また利用します。,\n";
  const blob = new Blob(["﻿"+sample], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="star-reviews-import-template.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function renderTi(t){

  const actions = t.status==="pending"
    ? `<button class="btn ok sm act" data-id="${t.id}" data-a="approve">掲載する</button>
       <button class="btn mut sm act" data-id="${t.id}" data-a="reject">非掲載</button>`
    : (t.status==="approved" ? `<button class="btn mut sm act" data-id="${t.id}" data-a="reject">掲載を外す</button>` : "");
  return `<div class="ti">
    <div class="meta"><span class="stars">${stars(t.rating)}</span>
      <span class="pill n">${lv}</span>${t.verified?'<span class="pill g">確認済み</span>':''}</div>
    <div class="body">${esc(t.body)}</div>
    ${video}
    <div class="who">${photo}<span class="muted">${esc(t.author_label)}</span></div>
    <div>${actions}</div>
  </div>`;
}
function bindTi(){
  document.querySelectorAll(".act").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r = await api(`/api/testimonials/${b.dataset.id}`,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({action:b.dataset.a})});
    if(r.ok){ toast(b.dataset.a==="approve"?"掲載しました":"外しました"); b.closest(".ti").style.opacity=.4; await loadForms(); }
    else if(r.data && r.data.limit_reached){ b.disabled=false; if(confirm(r.data.error+"\n\nプランページを開きますか？")) document.querySelector('.tab[data-t="plan"]').click(); }
    else { toast(r.data.error||"失敗しました"); b.disabled=false; }
  });
}

const DELAYS = [["0","今すぐ"],["1","翌日"],["3","3日後"],["7","1週間後"],["14","2週間後"],["30","30日後"]];
function fupStatusPill(s){
  if(s==="pending") return `<span class="pill o">予約中</span>`;
  if(s==="sent") return `<span class="pill g">送信済み</span>`;
  if(s==="canceled") return `<span class="pill n">取消</span>`;
  return `<span class="pill n">失敗</span>`;
}
function fmtDate(epoch){ if(!epoch) return ""; const d=new Date(epoch*1000); return `${d.getMonth()+1}/${d.getDate()}`; }
async function renderFollowup(){
  const v=$("view");
  if(!STATE.forms || STATE.forms.length===0){ v.innerHTML=`<div class="empty">先にフォームを作成すると、フォローアップを予約できます。</div>`; return; }
  v.innerHTML=`<div class="card"><h2>自動フォローアップ</h2><p class="muted">読み込み中…</p></div>`;
  const r = await api("/api/followups");
  const d = r.ok ? r.data : {enabled:false,counts:{pending:0,sent:0},items:[]};
  const formOpts = STATE.forms.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("");
  const delayOpts = DELAYS.map(([v,l])=>`<option value="${v}" ${v==="3"?"selected":""}>${l}</option>`).join("");
  const rows = (d.items||[]).map(it=>`
    <div class="ti" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><b style="font-size:13.5px">${esc(it.to_name||it.to_email)}</b> ${fupStatusPill(it.status)}
        <div class="muted" style="margin-top:2px;font-size:12px">${esc(it.to_email)} ・ ${it.status==="sent"?("送信 "+fmtDate(it.sent_at)):("予定 "+fmtDate(it.send_at))}</div></div>
      ${it.status==="pending"?`<button class="btn mut sm" data-cancel="${it.id}">取消</button>`:""}
    </div></div>`).join("") || `<div class="empty" style="padding:20px">まだ予約はありません。</div>`;

  v.innerHTML=`
    <div class="card">
      <h2>自動フォローアップ</h2>
      <p class="muted" style="margin-top:-8px">来店・購入のあったお客様に、指定した日数のあとで「ご感想をお聞かせください」のメールを自動送信します。レビューが集まる数を一番伸ばせる機能です。</p>
      ${d.enabled===false?`<div class="empty" style="margin:4px 0">この機能はまだ有効化されていません（データベースの更新 0009 の適用が必要です）。</div>`:`
      <div class="row" style="margin-top:6px">
        <div><label>どのフォームへ誘導するか</label><select id="fu_form">${formOpts}</select></div>
        <div><label>送信タイミング</label><select id="fu_delay">${delayOpts}</select></div>
      </div>
      <label style="margin-top:8px">送信先（1行に1件。「メール, お名前」の形式。お名前は省略可）</label>
      <textarea id="fu_list" rows="6" placeholder="hanako@example.com, 山田 花子&#10;taro@example.com"></textarea>
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <button class="btn" id="fu_add">この内容で予約する</button>
        <span class="muted" id="fu_msg"></span>
      </div>
      <p class="muted" style="margin-top:10px;font-size:11.5px">※ 送信にはメール設定（Resend）が有効である必要があります。配信は毎時まとめて行われます。</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">状況</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div style="flex:1;min-width:110px;background:#fffef9;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px"><div class="muted" style="font-size:11.5px">予約中</div><div style="font-size:22px;font-weight:800;font-family:var(--disp)">${d.counts?.pending||0}</div></div>
        <div style="flex:1;min-width:110px;background:#fffef9;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px"><div class="muted" style="font-size:11.5px">送信済み</div><div style="font-size:22px;font-weight:800;font-family:var(--disp)">${d.counts?.sent||0}</div></div>
      </div>
      ${rows}
    </div>`;

  if($("fu_add")) $("fu_add").onclick = async ()=>{
    const raw = $("fu_list").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const recipients = raw.map(line=>{ const parts=line.split(/[,\t]/).map(x=>x.trim()); return {email:parts[0]||"", name:parts[1]||""}; });
    if(recipients.length===0){ toast("送信先を入力してください"); return; }
    $("fu_add").disabled=true;
    const res = await api("/api/followups",{method:"POST",headers:{"content-type":"application/json"},

    if(res.ok){ toast(`${res.data.queued}件を予約しました`); renderFollowup(); }
    else { toast(res.data.error||"予約に失敗しました"); }
  };
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{
    const res=await api("/api/followups/"+b.dataset.cancel,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({action:"cancel"})});
    if(res.ok){ toast("取り消しました"); renderFollowup(); } else toast(res.data.error||"失敗しました");
  });
}

      <button class="btn ghost sm" id="em_copy" style="margin-top:11px">コードをコピー</button>
      <p class="muted" style="margin-top:12px">置き場所を指定したいときは、表示したい位置に次のタグを置きます。</p>
      <div class="code">${esc('<div data-star-reviews></div>')}</div>
    </div>
    <div class="card">
      <h3>Google検索に★を表示（SEO）</h3>
      <p class="muted" style="margin-top:-6px">貼るだけでレビューの構造化データ(JSON-LD)も自動出力され、Google検索で★リッチスニペットの対象になります（反映はGoogleの判断・数日〜）。不要なら <code>data-schema="off"</code> を足してください。</p>
    </div>`;

  // 初期値を反映
  $("em_accent").value = S.accent;
  $("em_layout").value = S.layout;
  $("em_count").value = String(S.count||0);
  $("em_star").value = S.star;
  $("em_theme").value = S.theme;
  $("em_summary").value = S.summary ? "1" : "0";
  $("em_autoplay").value = S.autoplay ? "1" : "0";

  const curAccent = ()=>$("em_accent").value;
  function markSwatch(){
    document.querySelectorAll("#em_sw .sw").forEach(b=>b.classList.toggle("on", b.dataset.hex.toLowerCase()===curAccent().toLowerCase()));
  }
  const opts = ()=>({
    accent: curAccent(), layout:$("em_layout").value, count:+$("em_count").value,
    star:$("em_star").value, theme:$("em_theme").value,
    summary:$("em_summary").value==="1", autoplay:$("em_autoplay").value==="1"
  });
  const update = ()=>{
    const o = opts();
    $("em_prev").innerHTML = pvRender(o);
    $("em_autowrap").style.opacity = o.layout==="carousel" ? "1" : ".5";
    $("em_autohint").textContent = o.layout==="carousel" ? "" : "カルーセルを選ぶと有効になります";
    $("snip").textContent = buildSnippet();
    markSwatch();
  };
  document.querySelectorAll("#em_sw .sw").forEach(b=>b.onclick=()=>{ $("em_accent").value=b.dataset.hex; update(); });
  ["em_accent","em_layout","em_count","em_star","em_theme","em_summary","em_autoplay"].forEach(id=>{ $(id).oninput=update; $(id).onchange=update; });
  $("em_samples").onclick = openStarSamples;
  $("em_copy").onclick = ()=>copy(buildSnippet());
  $("em_save").onclick = async ()=>{
    const btn=$("em_save"); btn.disabled=true;
    const r = await api("/api/walls/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(opts())});
    btn.disabled=false;
    if(r.ok){ toast("保存しました（埋め込み・声の壁ページに反映）"); const s=$("em_saved"); s.style.display="inline-block"; setTimeout(()=>s.style.display="none",2200); }
    else { toast(r.data.error||"保存に失敗しました"); }
  };
  bindHostedCard();
  update();
}

boot();
</script>
</body>
</html>
