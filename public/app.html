<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ダッシュボード｜star-reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fffdf5; --panel:#fff; --ink:#1c1a12; --ink-soft:#413d30; --muted:#7c7563;
    --sun:#ffc62b; --sun-deep:#eaa400; --sun-soft:#ffe7a0; --mark:#ffd84d;
    --line:#ece3cf; --line-strong:#e0d4b6; --ok:#1c7d52; --ok-bg:#e2f3e8;
    --disp:"Space Grotesk",system-ui,sans-serif;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7}
  .top{background:var(--ink);color:#fff}
  .top .in{max-width:940px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .logo{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:16px;color:#fff}
  .logo .star{width:16px;height:16px;color:var(--sun)}
  .logo em{font-style:normal;color:#938b78}
  .biz{font-size:13px;color:#cfc8b6}
  .logout{font-size:12.5px;color:#cfc8b6;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:var(--jp)}
  .logout:hover{color:#fff}
  .tabbar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .tabs{max-width:940px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow:auto}
  .tab{border:0;background:none;padding:15px 14px;font:inherit;font-weight:800;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.14s}
  .tab:hover{color:var(--ink-soft)}
  .tab.on{color:var(--ink);border-color:var(--sun-deep)}
  main{max-width:940px;margin:0 auto;padding:24px 18px 80px}
  @media(max-width:640px){
    .top .in{padding:14px 15px}
    .tabs{padding:0 15px}
    main{padding:24px 15px 80px}
  }
  .card{background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;padding:20px;margin-bottom:16px;
    box-shadow:0 4px 16px rgba(60,46,12,.05)}
  h2{font-size:18px;margin:0 0 15px;font-weight:800;letter-spacing:-.01em}
  h3{font-size:15px;margin:0 0 9px;font-weight:800}
  label{font-size:13px;font-weight:700;display:block;margin:0 0 6px;color:var(--ink-soft)}
  input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line-strong);
    border-radius:11px;padding:11px 13px;font:inherit;background:#fffef9;margin-bottom:12px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px var(--sun-soft)}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .row>*{flex:1;min-width:130px}
  .btn{border:0;border-radius:11px;background:var(--ink);color:#fff;font-weight:800;padding:12px 17px;
    cursor:pointer;font-size:14px;transition:.14s;font-family:var(--jp)}
  .btn:hover{background:#000;transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn.ok{background:var(--ok)}.btn.ok:hover{background:#166543}
  .btn.mut{background:#f0ead9;color:var(--muted)}.btn.mut:hover{background:#e7dfc9;transform:none}
  .btn.sm{padding:8px 14px;font-size:13px}
  .chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin-right:14px;cursor:pointer}
  .chk input{accent-color:var(--sun-deep);width:16px;height:16px}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px}
  .pill.g{background:var(--ok-bg);color:var(--ok)}
  .pill.o{background:var(--sun);color:var(--ink)}
  .pill.n{background:#efe8d7;color:var(--muted)}
  .stars{color:var(--sun-deep);font-size:15px;letter-spacing:1.5px}
  .ti{border:1.5px solid var(--line-strong);border-radius:13px;padding:15px;margin-bottom:12px;background:#fffef9}
  .ti .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ti .body{font-size:14.5px;margin:6px 0 11px;white-space:pre-wrap;color:var(--ink-soft)}
  .ti .who{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .ti img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  .code{background:var(--ink);color:#ffe9a8;border-radius:11px;padding:13px 15px;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow:auto;white-space:pre}
  .copy{margin-top:8px}
  .link{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fbf4e3;
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;word-break:break-all}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px;
    background:var(--panel);border:1.5px dashed var(--line-strong);border-radius:16px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="logo">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.95 6.3 6.9.86-5.1 4.72 1.36 6.82L12 17.9l-6.06 3.4 1.35-6.82-5.1-4.72 6.9-.86z"/></svg>
    star<em>·</em>reviews
  </span>
  <span><span class="biz" id="bizName"></span> <button class="logout" id="logout">ログアウト</button></span>
</div></div>
<div class="tabbar"><div class="tabs" id="tabs">
  <button class="tab on" data-t="forms">フォーム</button>
  <button class="tab" data-t="inbox">受信トレイ</button>
  <button class="tab" data-t="import">インポート</button>
  <button class="tab" data-t="rewards">返礼設定</button>
  <button class="tab" data-t="embed">埋め込み</button>
</div></div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id)=>document.getElementById(id);
const api = (u,o)=>fetch(u,o).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
const esc = (s)=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;};
const stars = (n)=>"★★★★★".slice(0,n|0)+"☆☆☆☆☆".slice(0,5-(n|0));
let STATE = { forms: [], embedToken: null, origin: location.origin };
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function copy(text){navigator.clipboard?.writeText(text);toast("コピーしました");}

async function boot(){
  const me = await api("/api/auth/me");
  if(!me.data.authenticated){ location.href="/"; return; }
  $("bizName").textContent = me.data.business?.name || "";
  $("logout").onclick = async()=>{ await api("/api/auth/logout",{method:"POST"}); location.href="/"; };
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); render(t.dataset.t);
  });
  await loadForms();
  render("forms");
}

async function loadForms(){
  const r = await api("/api/forms");
  STATE.forms = r.data.forms || [];
  STATE.embedToken = STATE.forms.find(f=>f.embed_token)?.embed_token || null;
  STATE.wallViews = STATE.forms[0]?.wall_views || 0;
}

function render(tab){
  if(tab==="forms") return renderForms();
  if(tab==="inbox") return renderInbox();
  if(tab==="import") return renderImport();
  if(tab==="rewards") return renderRewards();
  if(tab==="embed") return renderEmbed();
}

/* ---------- フォーム ---------- */
function renderForms(){
  const list = STATE.forms.map(f=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h3 style="margin:0">${esc(f.title)}</h3>
        <span><span class="pill o">未対応 ${f.pending_count}</span> <span class="pill g">掲載 ${f.approved_count}</span></span>
      </div>
      <p class="muted" style="margin:7px 0 10px;display:flex;gap:14px">
        <span>👁 フォーム閲覧 <b style="color:var(--ink)">${f.views||0}</b></span>
        <span>★ 掲載中 ${f.approved_count}件</span>
      </p>
      <p class="muted" style="margin:8px 0 4px">投稿リンク（LINEやメールに貼る）</p>
      <div class="link">${STATE.origin}/f/${esc(f.slug)}</div>
      <button class="btn ghost sm copy" style="margin-top:9px" onclick="copy('${STATE.origin}/f/${esc(f.slug)}')">リンクをコピー</button>
    </div>`).join("") || `<div class="empty">まだフォームがありません。最初のフォームを作りましょう。</div>`;

  $("view").innerHTML = `
    <div class="card">
      <h2>新しいフォームを作成</h2>
      <label>タイトル</label>
      <input type="text" id="f_title" placeholder="例）カフェ・ソレイユ のお客様の声">
      <label>案内文（任意）</label>
      <textarea id="f_intro" rows="2" placeholder="ご来店ありがとうございました。感想をひとことお願いします！"></textarea>
      <label>お礼メッセージ（投稿後に表示）</label>
      <input type="text" id="f_thanks" placeholder="ありがとうございました！">
      <label>集める出し方</label>
      <div style="margin-bottom:12px">
        <label class="chk"><input type="checkbox" id="lv1" checked disabled> 星＋ひとこと（匿名）</label>
        <label class="chk"><input type="checkbox" id="lv2" checked> 実名・写真</label>
        <label class="chk"><input type="checkbox" id="lv3"> 顔出し動画（Phase1）</label>
      </div>
      <label class="chk"><input type="checkbox" id="f_verified"> 検証済み（購入者リンク経由）のみ返礼する</label>
      <div style="margin-top:16px"><button class="btn" id="createForm">作成する</button></div>
    </div>
    ${list}`;

  $("createForm").onclick = async ()=>{
    const title = $("f_title").value.trim();
    if(!title){ toast("タイトルを入力してください"); return; }
    const levels = ["1"]; if($("lv2").checked) levels.push("2"); if($("lv3").checked) levels.push("3");
    const r = await api("/api/forms",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({title,intro:$("f_intro").value.trim(),thanks_message:$("f_thanks").value.trim(),
        levels_enabled:levels.join(","),require_verified:$("f_verified").checked})});
    if(!r.ok){ toast(r.data.error||"作成に失敗"); return; }
    toast("作成しました"); await loadForms(); renderForms();
  };
}

/* ---------- 受信トレイ ---------- */
async function renderInbox(){
  const opts = STATE.forms.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("");
  $("view").innerHTML = `
    <div class="card">
      <div class="row">
        <div><label>フォーム</label><select id="in_form"><option value="">すべて</option>${opts}</select></div>
        <div><label>状態</label><select id="in_status">
          <option value="pending">未対応</option><option value="approved">掲載中</option><option value="rejected">非掲載</option>
        </select></div>
      </div>
    </div>
    <div id="inboxList"><div class="empty">読み込み中…</div></div>`;
  const load = async ()=>{
    const fid = $("in_form").value, st = $("in_status").value;
    const r = await api(`/api/testimonials?status=${st}${fid?`&form_id=${fid}`:""}`);
    const items = r.data.testimonials || [];
    $("inboxList").innerHTML = items.length ? items.map(renderTi).join("") : `<div class="empty">該当する声はありません。</div>`;
    bindTi();
  };
  $("in_form").onchange = load; $("in_status").onchange = load;
  load();
}
function renderTi(t){
  const lv = {1:"匿名",2:"実名・写真",3:"動画"}[t.level]||"";
  const photo = t.photo_key ? `<img src="/api/media/${esc(t.photo_key)}" alt="">` : "";
  const actions = t.status==="pending"
    ? `<button class="btn ok sm act" data-id="${t.id}" data-a="approve">掲載する</button>
       <button class="btn mut sm act" data-id="${t.id}" data-a="reject">非掲載</button>`
    : (t.status==="approved" ? `<button class="btn mut sm act" data-id="${t.id}" data-a="reject">掲載を外す</button>` : "");
  return `<div class="ti">
    <div class="meta"><span class="stars">${stars(t.rating)}</span>
      <span class="pill n">${lv}</span>${t.verified?'<span class="pill g">確認済み</span>':''}</div>
    <div class="body">${esc(t.body)}</div>
    <div class="who">${photo}<span class="muted">${esc(t.author_label)}</span></div>
    <div>${actions}</div>
  </div>`;
}
function bindTi(){
  document.querySelectorAll(".act").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r = await api(`/api/testimonials/${b.dataset.id}`,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({action:b.dataset.a})});
    if(r.ok){ toast(b.dataset.a==="approve"?"掲載しました":"外しました"); b.closest(".ti").style.opacity=.4; await loadForms(); }
    else { toast("失敗しました"); b.disabled=false; }
  });
}

/* ---------- 手動インポート ---------- */
function renderImport(){
  if(!STATE.forms.length){ $("view").innerHTML=`<div class="empty">先にフォームを作成してください。</div>`; return; }
  const opts = STATE.forms.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("");
  $("view").innerHTML = `
    <div class="card">
      <h2>既存の声をインポート</h2>
      <p class="muted" style="margin-top:-8px">Googleクチコミ・アンケート用紙・SNSなど、すでにもらった声をここに登録できます。登録した声は<b>すぐに「声の壁」に掲載</b>されます。</p>
      <div class="row">
        <div><label>星</label><select id="im_rating">
          <option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option>
          <option value="3">★★★☆☆ (3)</option><option value="2">★★☆☆☆ (2)</option><option value="1">★☆☆☆☆ (1)</option>
        </select></div>
        <div><label>出所（任意）</label><input type="text" id="im_source" placeholder="例）Google / Instagram / 手書き"></div>
      </div>
      <label>声の本文</label>
      <textarea id="im_body" rows="3" placeholder="いただいた感想をそのまま貼り付け"></textarea>
      <div class="row">
        <div><label>お名前・表示名（任意）</label><input type="text" id="im_name" placeholder="例）M.T様 / 匿名"></div>
        <div><label>元の日付（任意）</label><input type="text" id="im_date" placeholder="2026-05-01"></div>
      </div>
      <label>登録先フォーム</label><select id="im_form">${opts}</select>
      <div style="margin-top:14px"><button class="btn" id="im_add">インポートして掲載</button></div>
    </div>
    <p class="muted">⚠️ 実際にお客様からいただいた声のみを登録してください。創作・自作の声の掲載は景品表示法などに触れる恐れがあります。</p>`;
  $("im_add").onclick = async ()=>{
    const body = $("im_body").value.trim();
    if(!body){ toast("声の本文を入力してください"); return; }
    const payload = {
      form_id: $("im_form").value,
      rating: +$("im_rating").value,
      body,
      author_name: $("im_name").value.trim(),
      source: $("im_source").value.trim(),
      date: $("im_date").value.trim()
    };
    const r = await api("/api/testimonials",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok){ toast(r.data.error||"登録に失敗"); return; }
    toast("掲載しました"); $("im_body").value=""; $("im_name").value=""; $("im_date").value="";
    await loadForms();
  };
}

/* ---------- 返礼設定 ---------- */
async function renderRewards(){
  if(!STATE.forms.length){ $("view").innerHTML=`<div class="empty">先にフォームを作成してください。</div>`; return; }
  const opts = STATE.forms.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("");
  $("view").innerHTML = `
    <div class="card">
      <h2>返礼設定</h2>
      <p class="muted" style="margin-top:-8px">出し方レベルごとに、お客様へのお礼を決めます。踏み込むほど手厚く。</p>
      <label>フォーム</label><select id="rw_form">${opts}</select>
      <div id="rwLevels"></div>
    </div>
    <p class="muted">⚠️ この特典は「自社サイト掲載用の声」専用です。特典と引き換えにGoogleクチコミを依頼するのはガイドライン違反なので繋げないでください。</p>`;
  const draw = async ()=>{
    const fid = $("rw_form").value;
    const r = await api(`/api/rewards?form_id=${fid}`);
    const rules = {}; (r.data.rules||[]).forEach(x=>rules[x.level]=x);
    const levelName={1:"Lv1 星＋ひとこと（匿名）",2:"Lv2 実名・写真",3:"Lv3 顔出し動画"};
    $("rwLevels").innerHTML = [1,2,3].map(lv=>{
      const ru=rules[lv]||{};
      return `<div class="ti">
        <h3>${levelName[lv]}</h3>
        <div class="row">
          <div><label>お礼の種類</label><select id="rt_${lv}">
            <option value="amount"${ru.reward_type==="amount"?" selected":""}>金額（円引き）</option>
            <option value="percent"${ru.reward_type==="percent"?" selected":""}>割引（%OFF）</option>
            <option value="code"${ru.reward_type==="code"?" selected":""}>特典コード</option>
            <option value="content"${ru.reward_type==="content"?" selected":""}>限定コンテンツ等</option>
          </select></div>
          <div><label>内容</label><input type="text" id="rv_${lv}" value="${esc(ru.reward_value||"")}" placeholder="例）300 / 10 / 限定PDF"></div>
        </div>
        <button class="btn sm save" data-lv="${lv}">このレベルを保存</button>
      </div>`;
    }).join("");
    document.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{
      const lv=b.dataset.lv;
      const r2=await api("/api/rewards",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({form_id:fid,level:+lv,reward_type:$("rt_"+lv).value,reward_value:$("rv_"+lv).value.trim()})});
      toast(r2.ok?"保存しました":"保存に失敗");
    });
  };
  $("rw_form").onchange = draw; draw();
}

/* ---------- 埋め込み ---------- */
function buildSnippet(layout, summary){
  const attrs = [`data-token="${STATE.embedToken}"`];
  if(layout && layout!=="grid") attrs.push(`data-layout="${layout}"`);
  if(!summary) attrs.push(`data-summary="off"`);
  return `<script src="${STATE.origin}/widget.js" ${attrs.join(" ")} async><\/script>`;
}
function renderEmbed(){
  if(!STATE.embedToken){ $("view").innerHTML=`<div class="empty">先にフォームを作成すると、埋め込みコードが発行されます。</div>`; return; }
  $("view").innerHTML = `
    <div class="card" style="background:var(--ink);color:#fff;border:0">
      <p style="margin:0;font-size:12.5px;color:#cfc8b6;font-weight:700;letter-spacing:.04em">声の壁の表示回数</p>
      <p style="margin:4px 0 0;font-size:34px;font-weight:800;font-family:var(--disp)">${(STATE.wallViews||0).toLocaleString()}<span style="font-size:15px;color:#cfc8b6;font-weight:700;font-family:var(--jp)"> 回</span></p>
    </div>
    <div class="card">
      <h2>サイトに「声の壁」を貼る</h2>
      <p class="muted" style="margin-top:-8px">掲載中の声が表示されます。見せ方を選んで、コードをコピーして貼るだけ。</p>
      <div class="row">
        <div><label>レイアウト</label><select id="em_layout">
          <option value="grid">グリッド（タイル状）</option>
          <option value="carousel">カルーセル（横スクロール）</option>
          <option value="list">リスト（縦1列）</option>
        </select></div>
        <div><label>星サマリー（平均★と件数）</label><select id="em_summary">
          <option value="1">表示する</option><option value="0">表示しない</option>
        </select></div>
      </div>
      <div class="code" id="snip"></div>
      <button class="btn ghost sm copy" id="em_copy" style="margin-top:11px">コードをコピー</button>
    </div>
    <div class="card">
      <h3>置き場所を指定したいとき</h3>
      <p class="muted" style="margin-top:-6px">表示したい場所に下のタグを置くと、そこに描画されます。</p>
      <div class="code">${esc('<div data-star-reviews></div>')}</div>
    </div>
    <div class="card">
      <h3>Google検索に★を表示（SEO）</h3>
      <p class="muted" style="margin-top:-6px">このタグを貼ると、レビューの構造化データ(JSON-LD)も自動で出力され、Google検索で★リッチスニペットの対象になります（反映はGoogleの判断・数日〜）。不要なら <code>data-schema="off"</code> を足してください。</p>
    </div>`;
  const update=()=>{
    const snip = buildSnippet($("em_layout").value, $("em_summary").value==="1");
    $("snip").textContent = snip;
    $("em_copy").onclick = ()=>copy(snip);
  };
  $("em_layout").onchange=update; $("em_summary").onchange=update; update();
}

boot();
</script>
</body>
