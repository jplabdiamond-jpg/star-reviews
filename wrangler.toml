name = "star-reviews"
compatibility_date = "2026-09-23"
pages_build_output_dir = "public"

# --- D1 (データベース) ---
# Cloudflareアカウント jp.lab.diamond (7969ecaa) 上の star-reviews-db
[[d1_databases]]
binding = "DB"
database_name = "star-reviews-db"
database_id = "5cc50ee4-bf85-42bb-b183-03302aac8b3d"
migrations_dir = "migrations"

# --- R2 (画像・動画) ---
# `npx wrangler r2 bucket create star-reviews-media` で作成
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "star-reviews-media"

# --- KV (セッション) ---
# Cloudflareアカウント jp.lab.diamond (7969ecaa) 上の SESSIONS namespace
[[kv_namespaces]]
binding = "SESSIONS"
id = "38a6d24676d8443da1e42e1c3767d600"

# --- Workers AI (動画の文字起こし・字幕生成) ---
# ダッシュボードの Settings → Functions → Bindings でも AI バインディング(名前=AI)を追加可
[ai]
binding = "AI"
