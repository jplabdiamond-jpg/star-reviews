name = "star-reviews"
compatibility_date = "2026-09-23"
pages_build_output_dir = "public"

# --- D1 (データベース) ---
# `npx wrangler d1 create star-reviews-db` で作成し、出力された database_id を貼る
[[d1_databases]]
binding = "DB"
database_name = "star-reviews-db"
database_id = "074f2bf2-091f-42bd-bba4-03459ffa0683"
migrations_dir = "migrations"

# --- R2 (画像・動画) ---
# `npx wrangler r2 bucket create star-reviews-media` で作成
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "star-reviews-media"

# --- KV (セッション) ---
# `npx wrangler kv namespace create SESSIONS` で作成し、出力された id を貼る
[[kv_namespaces]]
binding = "SESSIONS"
id = "4148e40f2a5144ae8ce14a675a6cea14"
